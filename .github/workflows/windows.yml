name: windows
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        shell: pwsh
        run: |
          if (Test-Path windows/PhoneBridge.sln) {
            dotnet build windows/PhoneBridge.sln -c Release
            dotnet test windows/PhoneBridge.sln -c Release --no-build
          } else { Write-Host "No solution yet, skipping." }
